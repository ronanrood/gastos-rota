<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Emerald Glow Gradient -->
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <!-- Emerald Badge Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Glass Overlay -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="112" fill="url(#centerGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.4" />

  <!-- Inner Badge Container -->
  <g filter="url(#shadow)">
    <rect x="56" y="56" width="400" height="400" rx="80" fill="#09090b" fill-opacity="0.6" stroke="#1e293b" stroke-width="3" />
    <rect x="56" y="56" width="400" height="200" rx="80" fill="url(#glassGrad)" />
  </g>

  <!-- Route Highway Path / Curves -->
  <path d="M120 380 C 180 380, 190 320, 256 320 C 322 320, 332 250, 390 250" fill="none" stroke="#334155" stroke-width="18" stroke-linecap="round" />
  <path d="M120 380 C 180 380, 190 320, 256 320 C 322 320, 332 250, 390 250" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round" stroke-dasharray="16 12" />

  <!-- Delivery Van / Truck Main Icon -->
  <g filter="url(#shadow)" transform="translate(112, 136)">
    <!-- Van Body -->
    <path d="M24 160 L24 48 C24 35 35 24 48 24 L176 24 C189 24 200 35 200 48 L200 72 L244 72 C254 72 263 78 268 86 L286 116 C288 120 290 125 290 130 L290 160 C290 173 279 184 266 184 L258 184 C254 162 235 146 212 146 C189 146 170 162 166 184 L122 184 C118 162 99 146 76 146 C53 146 34 162 30 184 L24 184 C11 184 0 173 0 160 Z" fill="url(#emeraldGrad)" />

    <!-- Van Cab Window -->
    <path d="M208 86 L208 132 L272 132 L254 94 C251 89 246 86 240 86 Z" fill="#020617" fill-opacity="0.75" />

    <!-- Speed/Cargo lines on the van box -->
    <rect x="52" y="60" width="80" height="10" rx="5" fill="#ffffff" fill-opacity="0.3" />
    <rect x="52" y="82" width="56" height="10" rx="5" fill="#ffffff" fill-opacity="0.3" />
    <rect x="52" y="104" width="70" height="10" rx="5" fill="#ffffff" fill-opacity="0.3" />

    <!-- Wheels Base -->
    <!-- Front Wheel -->
    <circle cx="212" cy="184" r="30" fill="#09090b" stroke="#334155" stroke-width="6" />
    <circle cx="212" cy="184" r="14" fill="#10b981" />
    <!-- Rear Wheel -->
    <circle cx="76" cy="184" r="30" fill="#09090b" stroke="#334155" stroke-width="6" />
    <circle cx="76" cy="184" r="14" fill="#10b981" />

    <!-- Front Headlight Glow -->
    <path d="M288 138 L304 142 L288 152 Z" fill="#fde047" filter="url(#glowFilter)" />
  </g>

  <!-- Glowing Coin / Currency Badge ($) -->
  <g filter="url(#shadow)" transform="translate(320, 270)">
    <!-- Gold/Emerald Coin Outer -->
    <circle cx="56" cy="56" r="56" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="4" />
    <circle cx="56" cy="56" r="46" fill="#09090b" />
    <circle cx="56" cy="56" r="42" fill="url(#goldGrad)" fill-opacity="0.15" />

    <!-- Dollar Symbol R$ / $ -->
    <text x="56" y="74" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="url(#goldGrad)" text-anchor="middle">
      $
    </text>
  </g>

  <!-- Pin Location Waypoint on Route -->
  <g transform="translate(100, 334)">
    <circle cx="20" cy="20" r="14" fill="#10b981" />
    <circle cx="20" cy="20" r="6" fill="#ffffff" />
  </g>
</svg>
